# Release: push a tag like v0.1.2 (matching package.json "version") and GitHub builds, tests and publishes it.
# The release gets the installer, its .blockmap and latest.yml, which installed copies use to auto-update.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload its files

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Tag matches package.json version
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Builds only (publish never): electron-builder's own publishing uploaded in parallel and created TWO releases per
      # tag (one with the installer + latest.yml, one with just the .blockmap). latest.yml is still written.
      - name: Build installer
        run: node scripts/dist.mjs

      # One release, created in one step with all three files. First removes any release already made for this tag
      # (drafts left by re-runs included) and the broken duplicates that hold only a .blockmap.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\" or ((.assets | length) == 1 and (.assets[0].name | endswith(\".blockmap\")))) | .id" |
            while read -r id; do echo "Removing old release $id"; gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          gh release create "$GITHUB_REF_NAME" \
            "release/IcyTweaker-Setup-$v.exe" "release/IcyTweaker-Setup-$v.exe.blockmap" "release/latest.yml" \
            --repo "$GITHUB_REPOSITORY" --title "IcyTweaker $v" --latest \
            --notes "Download **IcyTweaker-Setup-$v.exe** below and run it. Installed copies update themselves."

      - name: Check the release has all three files
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          names=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$names"
          for f in "IcyTweaker-Setup-$v.exe" "IcyTweaker-Setup-$v.exe.blockmap" latest.yml; do
            echo "$names" | grep -qxF "$f" || { echo "::error::Release is missing $f"; exit 1; }
          done
