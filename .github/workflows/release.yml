# Release: push a tag like v0.1.2 (matching package.json "version") and GitHub builds, tests and publishes it.
# The release gets the installer, its .blockmap and latest.yml, which installed copies use to auto-update.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload its files

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Tag matches package.json version
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Build installer and publish the release
        run: node scripts/dist.mjs
        env:
          PUBLISH: always
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder has finished "successfully" with files missing from the release (the .blockmap on every
      # release so far, the installer once). Upload whatever is missing from release/, then insist all three are there.
      - name: Make sure the release has all three files
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          files=("IcyTweaker-Setup-$v.exe" "IcyTweaker-Setup-$v.exe.blockmap" "latest.yml")
          have() { gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qxF "$1"; }
          for f in "${files[@]}"; do
            if ! have "$f"; then
              echo "Uploading missing $f"
              gh release upload "$GITHUB_REF_NAME" "release/$f" --repo "$GITHUB_REPOSITORY" --clobber
            fi
          done
          for f in "${files[@]}"; do have "$f" || { echo "::error::Release is still missing $f"; exit 1; }; done
          echo "All three files are on the release."
