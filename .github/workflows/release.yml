# Release: push a tag like v0.1.2 (matching package.json "version") and GitHub builds, tests and publishes it.
# The release gets the installer, its .blockmap and latest.yml, which installed copies use to auto-update.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload its files

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Tag matches package.json version
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Build installer and publish the release
        run: node scripts/dist.mjs
        env:
          PUBLISH: always
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder once finished "successfully" with only the .blockmap uploaded (v0.1.5). Fail loudly instead.
      - name: Check the release has all three files
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          names=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$names"
          for f in "IcyTweaker-Setup-$v.exe" "IcyTweaker-Setup-$v.exe.blockmap" latest.yml; do
            echo "$names" | grep -qxF "$f" || { echo "::error::Release is missing $f"; exit 1; }
          done
